name: Bug Report
description: File a bug report to help us improve the platform
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS, Node version (e.g. Chrome 122, Windows 11, Node 20)
